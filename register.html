<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Request Client Portal Access — ONYX Architecture Studio.">
    <title>Request Client Access — ONYX</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    
    <!-- Google Fonts: Syne & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: var(--bg-deep); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card p-4 p-md-5" style="border: 1px solid var(--border-accent); border-radius: var(--radius-xl); background: var(--bg-surface-elevated); box-shadow: var(--shadow-lg);">
                    <div class="text-center mb-4">
                        <a href="index.html" class="d-inline-flex align-items-center gap-2 mb-3 text-decoration-none">
                            <div class="brand-badge" style="width: 44px; height: 44px; font-size: 1.3rem;">O</div>
                            <span style="font-family: var(--font-heading); font-size: 1.8rem; font-weight: 800;" class="gradient-text">ONYX</span>
                        </a>
                        <h2 class="h3 text-white mb-1">Request Atelier Portal</h2>
                        <p class="text-secondary small">Register for project status tracking, BIM coordination, and direct partner messaging.</p>
                    </div>

                    <form id="registerForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">First Name *</label>
                                    <input type="text" class="form-control" placeholder="Elena" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Last Name *</label>
                                    <input type="text" class="form-control" placeholder="Rostova" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-group">
                                    <label class="form-label">Corporate / Personal Email *</label>
                                    <input type="email" class="form-control" placeholder="elena@domain.com" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-group">
                                    <label class="form-label">Phone / WhatsApp Number *</label>
                                    <input type="tel" class="form-control" placeholder="+1 (555) 000-0000" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Create Password *</label>
                                    <div class="password-input-wrapper">
                                        <input type="password" class="form-control" placeholder="••••••••••••" required>
                                        <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                                            <i class="far fa-eye"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Confirm Password *</label>
                                    <div class="password-input-wrapper">
                                        <input type="password" class="form-control" placeholder="••••••••••••" required>
                                        <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                                            <i class="far fa-eye"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-check mb-2">
                                    <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                                    <label class="form-check-label small" for="agreeTerms">I agree to the <a href="#" class="text-accent">Confidentiality Protocol & Terms</a> *</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary w-100 mb-3">
                                    <span>Register Atelier Account</span>
                                    <i class="fas fa-arrow-right ms-2"></i>
                                </button>

                                <!-- Social Auth Links -->
                                <div class="auth-divider">
                                    <span>Or Register With</span>
                                </div>
                                <div class="auth-social-row">
                                    <a href="#" class="auth-social-btn" title="Register with Google" aria-label="Sign up with Google"><i class="fab fa-google"></i></a>
                                    <a href="#" class="auth-social-btn" title="Register with Apple" aria-label="Sign up with Apple"><i class="fab fa-apple"></i></a>
                                    <a href="#" class="auth-social-btn" title="Register with LinkedIn" aria-label="Sign up with LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                                    <a href="#" class="auth-social-btn" title="Register with GitHub" aria-label="Sign up with GitHub"><i class="fab fa-github"></i></a>
                                </div>

                                <div class="text-center">
                                    <p class="text-muted small mb-0">Already registered? <a href="login.html" class="text-accent fw-bold">Login to Portal</a></p>
                                </div>
                            </div>
                        </div>
                        <div class="form-message"></div>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-10">
                        <a href="index.html" class="text-secondary small"><i class="fas fa-arrow-left me-1"></i> Return to Main Atelier</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- Custom JS -->
    <script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Client & Partner Portal Login — ONYX Architecture Studio.">
    <title>Client Portal Login — ONYX</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    
    <!-- Google Fonts: Syne & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: var(--bg-deep); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card p-4 p-md-5" style="border: 1px solid var(--border-accent); border-radius: var(--radius-xl); background: var(--bg-surface-elevated); box-shadow: var(--shadow-lg);">
                    <div class="text-center mb-4">
                        <a href="index.html" class="d-inline-flex align-items-center gap-2 mb-3 text-decoration-none">
                            <div class="brand-badge" style="width: 44px; height: 44px; font-size: 1.3rem;">O</div>
                            <span style="font-family: var(--font-heading); font-size: 1.8rem; font-weight: 800;" class="gradient-text">ONYX</span>
                        </a>
                        <h2 class="h3 text-white mb-1">Client Atelier Portal</h2>
                        <p class="text-secondary small">Access confidential project milestones, BIM models, and site VR feeds.</p>
                    </div>

                    <form id="loginForm">
                        <div class="form-group mb-3">
                            <label for="loginEmail" class="form-label">Client / Partner Email *</label>
                            <input type="email" class="form-control" id="loginEmail" placeholder="client@domain.com" required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="loginPassword" class="form-label">Password *</label>
                            <div class="password-input-wrapper">
                                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••••••" required>
                                <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                                    <i class="far fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label small" for="rememberMe">Remember atelier session</label>
                            </div>
                            <a href="#" class="text-accent small">Reset credentials?</a>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3">
                            <span>Access Atelier Portal</span>
                            <i class="fas fa-lock ms-2"></i>
                        </button>

                        <!-- Social Auth Links -->
                        <div class="auth-divider">
                            <span>Or Continue With</span>
                        </div>
                        <div class="auth-social-row">
                            <a href="#" class="auth-social-btn" title="Continue with Google" aria-label="Sign in with Google"><i class="fab fa-google"></i></a>
                            <a href="#" class="auth-social-btn" title="Continue with Apple" aria-label="Sign in with Apple"><i class="fab fa-apple"></i></a>
                            <a href="#" class="auth-social-btn" title="Continue with LinkedIn" aria-label="Sign in with LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                            <a href="#" class="auth-social-btn" title="Continue with GitHub" aria-label="Sign in with GitHub"><i class="fab fa-github"></i></a>
                        </div>

                        <div class="text-center">
                            <p class="text-muted small mb-0">New project client? <a href="register.html" class="text-accent fw-bold">Request Portal Access</a></p>
                        </div>
                        <div class="form-message"></div>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-10">
                        <a href="index.html" class="text-secondary small"><i class="fas fa-arrow-left me-1"></i> Return to Main Atelier</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- Custom JS -->
    <script src="js/main.js"></script>
</body>
</html>
